<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kira Diary — Concept</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Nuxt mount point for monopo-bg -->
  <div id="__nuxt"></div>

  <main class="phone-frame">
    <section class="hero-scene">
      <!-- monopo background will render here -->
      <div class="grain"></div>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="liquid-object" aria-hidden="true">
        <span class="liquid-core"></span>
        <span class="liquid-rim"></span>
        <span class="liquid-glare"></span>
      </div>
      <div class="silhouette">
        <div class="head"></div>
        <div class="neck"></div>
        <div class="body"></div>
        <div class="leg leg-l"></div>
        <div class="leg leg-r"></div>
      </div>

      <header class="topbar">
        <div>
          <p class="eyebrow">ДНЕВНИК КИРЫ</p>
          <h1>Сегодня</h1>
        </div>
        <div class="sync-pill">1 запись</div>
      </header>

      <section class="score-card glass main-card">
        <div class="score-head">
          <div>
            <p class="label">Оценка Киры</p>
            <div class="score">6.2</div>
          </div>
          <div class="score-pill">сегодня</div>
        </div>
        <div class="wave is-empty">
          <span></span><span></span><span></span>
          <i class="dot dot-l"></i><i class="dot dot-r"></i>
        </div>
      </section>

      <section class="quick-grid">
        <article class="glass tile">
          <span class="tile-icon icon-wake"></span>
          <p>Подъём</p>
          <strong>10:30</strong>
        </article>
        <article class="glass tile">
          <span class="tile-icon icon-sleep"></span>
          <p>Сон</p>
          <strong>02:00</strong>
        </article>
        <article class="glass tile selected">
          <span class="tile-icon icon-habit"></span>
          <p>Привычки</p>
          <strong>2 / 6</strong>
        </article>
        <article class="glass tile">
          <span class="tile-icon icon-voice"></span>
          <p>Голос</p>
          <strong>есть</strong>
        </article>
      </section>

      <section class="month-card glass">
        <div class="month-head">
          <div>
            <p class="label">Май</p>
            <strong>6.2 средняя</strong>
          </div>
          <span>1 запись</span>
        </div>
        <div class="dot-calendar" aria-label="month score dots">
          <i class="s6 active"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i>
          <i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i>
          <i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i>
          <i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i><i class="empty"></i>
        </div>
      </section>
    </section>
  </main>
  <script src="./polyfill.min.js"></script>
  <script src="./9a94800.js"></script>
  <script src="./8d8fa77.js"></script>
  <script src="./be4e259.js"></script>
  <script src="./aa1acf2.js"></script>
</body>
</html>
